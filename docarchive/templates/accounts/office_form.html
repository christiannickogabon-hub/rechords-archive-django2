{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">Directory</div><h1>{{ heading }}</h1></div></div>
<div class="card" style="max-width:560px">
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "form_field.html" %}{% endfor %}
    <div class="btn-row" style="margin-top:1rem">
      <button class="btn" type="submit"><svg class="icon"><use href="#icon-check"/></svg>Save office</button>
      <a class="btn btn--quiet" href="{% url 'accounts:office_list' %}"><svg class="icon"><use href="#icon-x"/></svg>Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
